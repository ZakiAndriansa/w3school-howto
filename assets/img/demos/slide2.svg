<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" preserveAspectRatio="xMidYMid slice">
  <!-- Danau di tengah hutan pinus -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb7e8"/>
      <stop offset="1" stop-color="#d4ecfa"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa3cf"/>
      <stop offset="1" stop-color="#2f6f99"/>
    </linearGradient>
    <g id="pine">
      <rect x="-4" y="0" width="8" height="18" fill="#4b3621"/>
      <path d="M0 -70 L26 0 L-26 0 Z" fill="#1f5b3a"/>
    </g>
  </defs>
  <rect width="1000" height="350" fill="url(#sky)"/>
  <ellipse cx="220" cy="70" rx="70" ry="18" fill="#fff" opacity="0.85"/>
  <ellipse cx="760" cy="55" rx="90" ry="20" fill="#fff" opacity="0.8"/>
  <path d="M0 210 Q250 120 500 200 T1000 180 L1000 240 L0 240 Z" fill="#5c9e5a"/>
  <rect y="240" width="1000" height="110" fill="url(#lake)"/>
  <path d="M0 240 L1000 240" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
  <use href="#pine" x="80" y="230"/>
  <use href="#pine" x="130" y="236" transform="scale(1)"/>
  <use href="#pine" x="190" y="226"/>
  <use href="#pine" x="780" y="230"/>
  <use href="#pine" x="840" y="222"/>
  <use href="#pine" x="900" y="232"/>
  <use href="#pine" x="950" y="226"/>
  <path d="M300 290 L520 290 M600 310 L760 310 M150 320 L260 320" stroke="#e6f4fb" stroke-opacity="0.6" stroke-width="3"/>
</svg>
