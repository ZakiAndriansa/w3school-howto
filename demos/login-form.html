<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px 0;
      font-family: Verdana, sans-serif;
      font-size: 15px;
    }

    /* Tombol pembuka (link ke #loginModal) */
    .open-btn {
      display: inline-block;
      padding: 8px 16px;
      background-color: #2196F3;
      color: #fff;
      font-size: 17px;
      text-decoration: none;
    }

    .open-btn:hover { box-shadow: 0 8px 16px 0 rgba(0, 0, 0, .2), 0 6px 20px 0 rgba(0, 0, 0, .19); }

    /* Modal: tersembunyi, muncul saat menjadi :target */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: auto;
      padding: 8px 0;
      background-color: rgba(0, 0, 0, .4);
    }

    .modal:target { display: block; }

    .modal-content {
      position: relative;
      max-width: 420px;
      margin: 0 auto;
      background-color: #fefefe;
      border: 1px solid #888;
      animation: zoom .6s;
    }

    @keyframes zoom {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .imgcontainer {
      position: relative;
      padding: 10px 0 0;
      text-align: center;
    }

    .avatar {
      width: 64px;
      margin: 0 auto;
      border-radius: 50%;
    }

    .close {
      position: absolute;
      top: 0;
      right: 16px;
      color: #000;
      font-size: 35px;
      font-weight: bold;
      text-decoration: none;
    }

    .close:hover { color: #f44336; }

    .container { padding: 8px 16px; }

    input[type=text],
    input[type=password] {
      width: 100%;
      margin: 4px 0 8px;
      padding: 8px 16px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    /* Validasi tampilan tanpa JS */
    input:focus:invalid { border-color: #f44336; }
    input:valid { border-color: #04AA6D; }

    .login-btn {
      width: 100%;
      margin: 2px 0 6px;
      padding: 10px 20px;
      border: none;
      background-color: #04AA6D;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .login-btn:hover { opacity: .8; }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: #f1f1f1;
    }

    .cancel-btn {
      padding: 8px 18px;
      background-color: #f44336;
      color: #fff;
      text-decoration: none;
    }

    .psw a { color: #2196F3; }
  </style>
</head>
<body>

  <a href="#loginModal" class="open-btn">Login</a>

  <div id="loginModal" class="modal">
    <!-- method="dialog": validasi required tetap jalan, halaman tidak berpindah -->
    <form class="modal-content" method="dialog">
      <div class="imgcontainer">
        <a href="#!" class="close" title="Close">&times;</a>
        <img src="../assets/img/demos/avatar-login.jpg" alt="Avatar" class="avatar">
      </div>

      <div class="container">
        <label for="uname"><b>Username</b></label>
        <input type="text" id="uname" placeholder="Enter Username" name="uname" required>

        <label for="psw"><b>Password</b></label>
        <input type="password" id="psw" placeholder="Enter Password" name="psw" required>

        <button type="submit" class="login-btn">Login</button>
        <label>
          <input type="checkbox" checked name="remember"> Remember me
        </label>
      </div>

      <div class="bottom">
        <a href="#!" class="cancel-btn">Cancel</a>
        <span class="psw">Forgot <a href="#!">password?</a></span>
      </div>
    </form>
  </div>

</body>
</html>
