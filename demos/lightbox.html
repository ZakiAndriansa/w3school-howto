<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightbox</title>
  <style>
    * { box-sizing: border-box; }

    /* Tinggi iframe pas dengan thumbnail, jadi tidak perlu scrollbar */
    html { overflow: hidden; }

    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    img { display: block; width: 100%; }

    /* Tiga thumbnail berjajar */
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .row img {
      aspect-ratio: 3 / 2;
      object-fit: cover;
      cursor: pointer;
      transition: box-shadow .3s;
    }

    .row img:hover { box-shadow: 0 4px 10px 0 rgba(0, 0, 0, .2), 0 4px 20px 0 rgba(0, 0, 0, .19); }

    /* Satu lightbox per gambar, dibuka lewat :target.
       Disusun rapat agar muat di iframe yang setinggi baris thumbnail. */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000;
      color: #fff;
      z-index: 999;
    }

    .lightbox:target { display: block; }

    .close {
      position: absolute;
      top: -8px;
      right: 12px;
      color: #fff;
      font-size: 40px;
      text-decoration: none;
      text-shadow: 0 0 6px rgba(0, 0, 0, .8);
    }

    .close:hover { color: #9e9e9e; }

    .lb-main {
      height: calc(100vh - 30px - 36px);
      object-fit: cover;
    }

    .lb-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 16px;
      font-size: 13px;
    }

    .lb-caption p { margin: 0; }

    .lb-caption a {
      color: #fff;
      font-size: 16px;
      text-decoration: none;
    }

    .lb-caption a:hover { color: #9e9e9e; }

    .lb-thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .lb-thumbs img {
      height: 36px;
      object-fit: cover;
      opacity: .6;
      transition: opacity .3s;
    }

    .lb-thumbs img:hover,
    .lb-thumbs .active img { opacity: 1; }

    /* Iframe sangat pendek (layar HP): sembunyikan thumbnail, gambar besar memakai seluruh tinggi */
    @media (max-height: 120px) {
      .lb-thumbs { display: none; }
      .lb-main { height: calc(100vh - 30px); }
    }
  </style>
</head>
<body>

  <div class="row">
    <a href="#lb1"><img src="../assets/img/demos/nature.jpg" alt="Nature and sunrise"></a>
    <a href="#lb2"><img src="../assets/img/demos/snow.jpg" alt="Snow"></a>
    <a href="#lb3"><img src="../assets/img/demos/mountains.jpg" alt="Mountains and fjords"></a>
  </div>

  <div id="lb1" class="lightbox">
    <a href="#!" class="close">&times;</a>
    <img class="lb-main" src="../assets/img/demos/nature-wide.jpg" alt="Nature and sunrise">
    <div class="lb-caption">
      <a href="#lb3">&#10094;</a>
      <p>Nature and sunrise</p>
      <a href="#lb2">&#10095;</a>
    </div>
    <div class="lb-thumbs">
      <a href="#lb1" class="active"><img src="../assets/img/demos/nature-wide.jpg" alt="Nature and sunrise"></a>
      <a href="#lb2"><img src="../assets/img/demos/snow-wide.jpg" alt="Snow"></a>
      <a href="#lb3"><img src="../assets/img/demos/mountains-wide.jpg" alt="Mountains and fjords"></a>
    </div>
  </div>

  <div id="lb2" class="lightbox">
    <a href="#!" class="close">&times;</a>
    <img class="lb-main" src="../assets/img/demos/snow-wide.jpg" alt="Snow">
    <div class="lb-caption">
      <a href="#lb1">&#10094;</a>
      <p>Snow</p>
      <a href="#lb3">&#10095;</a>
    </div>
    <div class="lb-thumbs">
      <a href="#lb1"><img src="../assets/img/demos/nature-wide.jpg" alt="Nature and sunrise"></a>
      <a href="#lb2" class="active"><img src="../assets/img/demos/snow-wide.jpg" alt="Snow"></a>
      <a href="#lb3"><img src="../assets/img/demos/mountains-wide.jpg" alt="Mountains and fjords"></a>
    </div>
  </div>

  <div id="lb3" class="lightbox">
    <a href="#!" class="close">&times;</a>
    <img class="lb-main" src="../assets/img/demos/mountains-wide.jpg" alt="Mountains and fjords">
    <div class="lb-caption">
      <a href="#lb2">&#10094;</a>
      <p>Mountains and fjords</p>
      <a href="#lb1">&#10095;</a>
    </div>
    <div class="lb-thumbs">
      <a href="#lb1"><img src="../assets/img/demos/nature-wide.jpg" alt="Nature and sunrise"></a>
      <a href="#lb2"><img src="../assets/img/demos/snow-wide.jpg" alt="Snow"></a>
      <a href="#lb3" class="active"><img src="../assets/img/demos/mountains-wide.jpg" alt="Mountains and fjords"></a>
    </div>
  </div>

</body>
</html>
