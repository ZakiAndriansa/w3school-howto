<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Dropdowns</title>
  <style>
    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 15px;
    }

    /* Checkbox penyimpan status buka/tutup (disembunyikan) */
    #toggle { display: none; }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* Label berperan sebagai tombol "Click" */
    .dropbtn {
      display: inline-block;
      box-sizing: border-box;
      width: 100px;
      padding: 11px 17px;
      background-color: #3498DB;
      color: #fff;
      font-size: 16px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .dropbtn:hover { opacity: .95; }

    .dropdown-content {
      display: none;
      position: absolute;
      min-width: 160px;
      overflow: auto;
      background-color: #f9f9f9;
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, .2);
      z-index: 1;
    }

    .dropdown-content a {
      display: block;
      padding: 12px 16px;
      color: #000;
      text-decoration: none;
    }

    .dropdown-content a:hover { background-color: #f1f1f1; }

    /* Klik tombol = centang checkbox = menu tampil; klik lagi = tutup */
    #toggle:checked ~ .dropdown-content { display: block; }
  </style>
</head>
<body>

  <div class="dropdown">
    <input type="checkbox" id="toggle">
    <label for="toggle" class="dropbtn">Click</label>
    <div class="dropdown-content">
      <a href="#!">Link 1</a>
      <a href="#!">Link 2</a>
      <a href="#!">Link 3</a>
    </div>
  </div>

</body>
</html>
