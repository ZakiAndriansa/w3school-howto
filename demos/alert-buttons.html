<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Buttons</title>
  <style>
    /* Scrollbar disembunyikan (isi tetap bisa digulir): tanpa ini scrollbar sesaat saat
       halaman dimuat bisa membuat teks turun baris dan tinggi iframe jadi tidak pas */
    html { scrollbar-width: none; }

    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      margin: 4px 2px;
      padding: 14px 28px;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;  /* seperti w3.css: tombol jadi 52px */
      text-align: center;
      cursor: pointer;
    }

    .success { background-color: #04AA6D; }
    .success:hover { background-color: #46a049; }

    .info { background-color: #2196F3; }
    .info:hover { background-color: #0b7dda; }

    .warning { background-color: #ff9800; }
    .warning:hover { background-color: #e68a00; }

    .danger { background-color: #f44336; }
    .danger:hover { background-color: #da190b; }

    .default { background-color: #e7e7e7; color: #000; }
    .default:hover { background-color: #ddd; }
  </style>
</head>
<body>

  <button class="btn success">Success</button>
  <button class="btn info">Info</button>
  <button class="btn warning">Warning</button>
  <button class="btn danger">Danger</button>
  <button class="btn default">Default</button>

</body>
</html>
