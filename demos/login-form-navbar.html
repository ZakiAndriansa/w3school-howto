<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form in Navbar</title>
  <style>
    /* Scrollbar disembunyikan (isi tetap bisa digulir): tanpa ini scrollbar sesaat saat
       halaman dimuat bisa membuat teks turun baris dan tinggi iframe jadi tidak pas */
    html { scrollbar-width: none; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 15px;
      line-height: 1.5;  /* seperti w3.css asli */
    }

    .topnav {
      overflow: hidden;
      background-color: #e9e9e9;
    }

    .topnav a {
      float: left;
      display: block;
      padding: 14px 16px;
      color: #000;
      font-size: 17px;
      text-align: center;
      text-decoration: none;
    }

    .topnav a:hover { background-color: #ddd; }

    .topnav a.active {
      background-color: #2196F3;
      color: #fff;
    }

    .login-container { float: right; }

    .login-container input {
      width: 120px;
      margin-top: 8px;
      padding: 6px;
      border: none;
      font-family: inherit;
      font-size: 17px;
    }

    .login-container button {
      float: right;
      margin: 8px 16px 0 0;
      padding: 6px 10px;
      border: none;
      background-color: #555;
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    .login-container button:hover { background-color: green; }

    /* Layar sempit: semua item bertumpuk */
    @media screen and (max-width: 600px) {
      .topnav .login-container { float: none; }

      .topnav a,
      .topnav input,
      .topnav .login-container button {
        float: none;
        display: block;
        width: 100%;
        margin: 0;
        padding: 14px;
        text-align: left;
      }

      .topnav input { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <div class="topnav">
    <a href="#!" class="active">Home</a>
    <a href="#!">About</a>
    <a href="#!">Contact</a>
    <!-- method="dialog": tombol Login tidak memindahkan halaman -->
    <form class="login-container" method="dialog">
      <input type="text" placeholder="Username" name="username">
      <input type="password" placeholder="Password" name="psw">
      <button type="submit">Login</button>
    </form>
  </div>

</body>
</html>
