<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Box</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    .btn-teal {
      display: inline-block;
      padding: 8px 16px;
      background-color: #009688;
      color: #fff;
      text-decoration: none;
    }

    .btn-teal:hover {
      background-color: #ccc;
      color: #000;
    }

    .btn-large {
      padding: 12px 24px;
      font-size: 18px;
    }

    /* Modal tersembunyi, muncul saat menjadi :target */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      padding-top: 30px;
      overflow: auto;
      background-color: rgba(0, 0, 0, .4);
      z-index: 3;
    }

    .modal:target { display: block; }

    .modal-content {
      position: relative;
      width: 600px;
      max-width: 92%;
      margin: auto;
      background-color: #fff;
      box-shadow: 0 4px 10px 0 rgba(0, 0, 0, .2), 0 4px 20px 0 rgba(0, 0, 0, .19);
      animation: animatetop .4s;
    }

    @keyframes animatetop {
      from { top: -300px; opacity: 0; }
      to { top: 0; opacity: 1; }
    }

    .modal-header,
    .modal-footer {
      position: relative;
      padding: 0.01em 16px;
      background-color: #009688;
      color: #fff;
    }

    .modal-header h2 {
      margin: 10px 0;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 32px;
      font-weight: 400;
    }

    .modal-body { padding: 0.01em 16px; }

    .close {
      position: absolute;
      top: 0;
      right: 0;
      padding: 8px 16px;
      color: #fff;
      font-size: 33px;
      line-height: 1.2;
      text-decoration: none;
    }

    .close:hover {
      background-color: #ccc;
      color: #000;
    }
  </style>
</head>
<body>

  <a href="#modal" class="btn-teal btn-large">Open Modal</a>

  <div id="modal" class="modal">
    <div class="modal-content">
      <header class="modal-header">
        <a href="#!" class="close">&times;</a>
        <h2>Modal Header</h2>
      </header>
      <div class="modal-body">
        <p>Hello World!</p>
        <p>Modals are awesome!</p>
        <p>Go Back To Examples <a href="#!" class="btn-teal">W3 How TO</a></p>
      </div>
      <footer class="modal-footer">
        <p>Modal Footer</p>
      </footer>
    </div>
  </div>

</body>
</html>
