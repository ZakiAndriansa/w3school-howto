<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Image</title>
  <style>
    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    /* Gambar kecil yang bisa diklik */
    .thumb img {
      display: block;
      width: 50%;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity .3s;
    }

    .thumb:hover img { opacity: .7; }

    /* Modal hitam, muncul saat :target */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      padding-top: 30px;
      overflow: auto;
      background-color: rgba(0, 0, 0, .9);
      z-index: 999;
    }

    .modal:target { display: block; }

    .modal-content,
    .caption {
      display: block;
      width: 80%;
      max-width: 700px;
      margin: auto;
      animation: zoom .6s;
    }

    .modal-content {
      max-height: calc(100vh - 100px);
      object-fit: contain;
    }

    .caption {
      padding: 10px 0;
      color: #ccc;
      text-align: center;
    }

    @keyframes zoom {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .close {
      position: absolute;
      top: 10px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      text-decoration: none;
      transition: .3s;
    }

    .close:hover { color: #bbb; }
  </style>
</head>
<body>

  <a href="#img-modal" class="thumb">
    <img src="../assets/img/demos/snow.svg" alt="Snow">
  </a>

  <div id="img-modal" class="modal">
    <a href="#!" class="close">&times;</a>
    <img class="modal-content" src="../assets/img/demos/snow.svg" alt="Snow">
    <div class="caption">Snow</div>
  </div>

</body>
</html>
