<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Navigation</title>
  <style>
    /* Scrollbar disembunyikan (isi tetap bisa digulir): tanpa ini scrollbar sesaat saat
       halaman dimuat bisa membuat teks turun baris dan tinggi iframe jadi tidak pas */
    html { scrollbar-width: none; }

    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    .topnav {
      overflow: hidden;
      background-color: #000;
    }

    .topnav a {
      float: left;
      padding: 16px;
      color: #fff;
      line-height: 24px;
      text-decoration: none;
    }

    .topnav a:hover {
      background-color: #ccc;
      color: #000;
    }

    .topnav a.active { background-color: #04AA6D; }

    .topnav a.active:hover {
      background-color: #059862;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="topnav">
    <a href="#!" class="active">Home</a>
    <a href="#!">News</a>
    <a href="#!">Contact</a>
  </div>

</body>
</html>
