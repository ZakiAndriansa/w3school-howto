<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Navigation</title>
  <style>
    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #ccc;
      color: #000;
    }

    /* Overlay layar penuh; dua varian arah animasi */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      background-color: rgba(0, 0, 0, .9);
      text-align: center;
      transition: .5s;
      z-index: 3;
    }

    .slide-right { width: 0; height: 100%; }
    .slide-down { width: 100%; height: 0; }

    /* Dibuka lewat :target */
    .slide-right:target { width: 100%; }
    .slide-down:target { height: 100%; }

    .overlay-content {
      position: relative;
      top: 20%;
      width: 100%;
      margin-top: 30px;
    }

    .overlay a {
      display: block;
      padding: 8px;
      color: #818181;
      font-size: 36px;
      white-space: nowrap;
      text-decoration: none;
      transition: color .3s;
    }

    .overlay a:hover { color: #f1f1f1; }

    .overlay .close {
      position: absolute;
      top: 10px;
      right: 45px;
      font-size: 60px;
    }
  </style>
</head>
<body>

  <a href="#nav-right" class="btn">Slide Right</a>
  <a href="#nav-down" class="btn">Slide Down</a>

  <div id="nav-right" class="overlay slide-right">
    <a href="#!" class="close">&times;</a>
    <div class="overlay-content">
      <a href="#!">About</a>
      <a href="#!">Services</a>
      <a href="#!">Clients</a>
      <a href="#!">Contact</a>
    </div>
  </div>

  <div id="nav-down" class="overlay slide-down">
    <a href="#!" class="close">&times;</a>
    <div class="overlay-content">
      <a href="#!">About</a>
      <a href="#!">Services</a>
      <a href="#!">Clients</a>
      <a href="#!">Contact</a>
    </div>
  </div>

</body>
</html>
