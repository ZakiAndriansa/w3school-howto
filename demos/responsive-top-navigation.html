<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Top Navigation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Checkbox untuk tombol hamburger (disembunyikan) */
    #menu-toggle { display: none; }

    .topnav {
      position: relative;
      overflow: hidden;
      background-color: #333;
    }

    .topnav a,
    .topnav .icon {
      float: left;
      display: block;
      padding: 16px;
      color: #f2f2f2;
      font-size: 17px;
      text-align: center;
      text-decoration: none;
    }

    .topnav a:hover,
    .topnav .icon:hover {
      background-color: #ddd;
      color: #000;
    }

    .topnav .icon {
      display: none;
      cursor: pointer;
      user-select: none;
    }

    /* Layar sempit: sisakan Home + tombol hamburger */
    @media screen and (max-width: 400px) {
      .topnav a:not(:first-of-type) { display: none; }

      .topnav .icon {
        display: block;
        position: absolute;
        top: 0;
        right: 0;
      }

      /* Hamburger dicentang: semua link tampil bertumpuk */
      #menu-toggle:checked + .topnav a {
        float: none;
        display: block;
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <input type="checkbox" id="menu-toggle">
  <div class="topnav">
    <a href="#!">Home</a>
    <a href="#!">News</a>
    <a href="#!">Contact</a>
    <a href="#!">About</a>
    <label for="menu-toggle" class="icon">&#9776;</label>
  </div>

</body>
</html>
