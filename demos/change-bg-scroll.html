<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Background on Scroll</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Tiap blok setinggi setengah layar; latar berganti saat discroll */
    .bg-image {
      height: 50%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .img1 { background-image: url("../assets/img/demos/snow.jpg"); }
    .img2 { background-image: url("../assets/img/demos/girl.jpg"); }
    .img3 { background-image: url("../assets/img/demos/lights.jpg"); }
    .img4 { background-image: url("../assets/img/demos/nature.jpg"); }
    .img5 { background-image: url("../assets/img/demos/forest.jpg"); }
    .img6 { background-image: url("../assets/img/demos/woods.jpg"); }

    /* Kotak teks tetap di tengah layar */
    .bg-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      padding: 20px;
      border: 10px solid #f1f1f1;
      background-color: rgba(0, 0, 0, .4);
      color: #fff;
      font-weight: bold;
      font-size: 80px;
      text-align: center;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="bg-image img1"></div>
  <div class="bg-image img2"></div>
  <div class="bg-image img3"></div>
  <div class="bg-image img4"></div>
  <div class="bg-image img5"></div>
  <div class="bg-image img6"></div>

  <div class="bg-text">TEXT</div>

</body>
</html>
