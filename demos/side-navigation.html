<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Navigation</title>
  <style>
    body {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 16px;
    }

    /* Tombol hitam ala w3-button */
    .btn {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 16px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #ccc;
      color: #000;
    }

    /* Latar gelap untuk versi "w/opacity" */
    .dim {
      position: fixed;
      inset: 0;
      width: 0;
      background-color: rgba(0, 0, 0, .9);
      opacity: 0;
      transition: opacity 1s;
      z-index: 3;
    }

    /* Panel samping, lebar 0 saat tertutup */
    .offcanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      padding-top: 60px;
      overflow-x: hidden;
      background-color: #111;
      transition: width .5s;
      z-index: 999;
    }

    .offcanvas a {
      display: block;
      padding: 8px 8px 8px 32px;
      color: #818181;
      font-size: 25px;
      white-space: nowrap;
      text-decoration: none;
      transition: color .3s;
    }

    .offcanvas a:hover { color: #f1f1f1; }

    .offcanvas .close {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 36px;
    }

    /* Dibuka lewat :target (link #sidenav atau #sidenav-dim) */
    #sidenav:target,
    #sidenav-dim:target .offcanvas { width: 250px; }

    #sidenav-dim:target {
      width: 100%;
      opacity: 1;
    }
  </style>
</head>
<body>

  <a href="#sidenav" class="btn">Sidenav overlay</a><br>
  <a href="#sidenav-dim" class="btn">Sidenav w/opacity</a>

  <nav id="sidenav" class="offcanvas">
    <a href="#!" class="close">&times;</a>
    <a href="#!">About</a>
    <a href="#!">Services</a>
    <a href="#!">Clients</a>
    <a href="#!">Contact</a>
  </nav>

  <div id="sidenav-dim" class="dim">
    <nav class="offcanvas">
      <a href="#!" class="close">&times;</a>
      <a href="#!">About</a>
      <a href="#!">Services</a>
      <a href="#!">Clients</a>
      <a href="#!">Contact</a>
    </nav>
  </div>

</body>
</html>
