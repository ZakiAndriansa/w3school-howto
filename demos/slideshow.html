<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Verdana, sans-serif;
      font-size: 15px;
    }

    /* Radio button penanda slide aktif (disembunyikan) */
    .slide-radio { display: none; }

    .slideshow-container {
      position: relative;
      max-width: 1000px;
      margin: auto;
    }

    .slide {
      display: none;
      position: relative;
    }

    /* Gambar mengisi tinggi iframe dikurangi area titik (39px) */
    .slide img {
      display: block;
      width: 100%;
      height: calc(100vh - 39px);
      object-fit: cover;
    }

    /* Tampilkan slide sesuai radio yang dipilih */
    #s1:checked ~ .slideshow-container .slide-1,
    #s2:checked ~ .slideshow-container .slide-2,
    #s3:checked ~ .slideshow-container .slide-3,
    #s4:checked ~ .slideshow-container .slide-4 {
      display: block;
      animation: fade 1.5s;
    }

    @keyframes fade {
      from { opacity: .4; }
      to { opacity: 1; }
    }

    .numbertext {
      position: absolute;
      top: 0;
      padding: 8px 12px;
      color: #f2f2f2;
      font-size: 12px;
    }

    .caption {
      position: absolute;
      bottom: 8px;
      width: 100%;
      padding: 8px 12px;
      color: #f2f2f2;
      text-align: center;
    }

    /* Tombol panah ❮ ❯ */
    .prev,
    .next {
      position: absolute;
      top: 50%;
      margin-top: -22px;
      padding: 16px;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      transition: background-color .6s ease;
    }

    .prev { left: 0; border-radius: 0 3px 3px 0; }
    .next { right: 0; border-radius: 3px 0 0 3px; }

    .prev:hover,
    .next:hover { background-color: rgba(0, 0, 0, .8); }

    /* Titik navigasi */
    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 39px;
    }

    .dot {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin: 0 2px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color .6s ease;
    }

    .dot:hover,
    #s1:checked ~ .dots .dot-1,
    #s2:checked ~ .dots .dot-2,
    #s3:checked ~ .dots .dot-3,
    #s4:checked ~ .dots .dot-4 {
      background-color: #717171;
    }
  </style>
</head>
<body>

  <input type="radio" name="slide" id="s1" class="slide-radio" checked>
  <input type="radio" name="slide" id="s2" class="slide-radio">
  <input type="radio" name="slide" id="s3" class="slide-radio">
  <input type="radio" name="slide" id="s4" class="slide-radio">

  <div class="slideshow-container">
    <div class="slide slide-1">
      <div class="numbertext">1 / 4</div>
      <img src="../assets/img/demos/slide1.svg" alt="Pegunungan saat matahari terbit">
      <div class="caption">Caption Text</div>
      <label for="s4" class="prev">&#10094;</label>
      <label for="s2" class="next">&#10095;</label>
    </div>

    <div class="slide slide-2">
      <div class="numbertext">2 / 4</div>
      <img src="../assets/img/demos/slide2.svg" alt="Danau di tengah hutan pinus">
      <div class="caption">Caption Two</div>
      <label for="s1" class="prev">&#10094;</label>
      <label for="s3" class="next">&#10095;</label>
    </div>

    <div class="slide slide-3">
      <div class="numbertext">3 / 4</div>
      <img src="../assets/img/demos/slide3.svg" alt="Gurun pasir dengan kaktus">
      <div class="caption">Caption Three</div>
      <label for="s2" class="prev">&#10094;</label>
      <label for="s4" class="next">&#10095;</label>
    </div>

    <div class="slide slide-4">
      <div class="numbertext">4 / 4</div>
      <img src="../assets/img/demos/slide4.svg" alt="Langit malam berbintang">
      <div class="caption">Caption Four</div>
      <label for="s3" class="prev">&#10094;</label>
      <label for="s1" class="next">&#10095;</label>
    </div>
  </div>

  <div class="dots">
    <label for="s1" class="dot dot-1"></label>
    <label for="s2" class="dot dot-2"></label>
    <label for="s3" class="dot dot-3"></label>
    <label for="s4" class="dot dot-4"></label>
  </div>

</body>
</html>
